<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        h1{
            text-align: center;
        }
        form{
            gap: 10px;
            display: flex;
            flex-direction: column;
        }

        label{
            font-weight: bold;
        }

         input{
            padding: 10px;
            font-size: 16px;
         }

         button{
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(40, 40, 229, 0.665);
            font-size: large;
            border: none;
            cursor: pointer;
         }

          button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>
    <h1>Register</h1>

   <form>
       <label for="fullname">Full Name</label>
       <input type="text" id="fullname" name="email" required/>

       <label for="Email">Email Address</label>
       <input type="text" id="Email Address" name="email" required/>

       <label for="password">Password</label>
       <input type="text" id="password" name="password" required/>

       <label for="conformpassword">Conform Password</label>
       <input type="text" id="confirm password" name="email" required/>
        
       <button>Register</button>
   </form>

</body>
</html>
