<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    border: 1px solid black;
    height: 300px;
    width: 600px;
    background-color: #d58686;
    text-align: center;
}

h1 {
    text-align: center;
}

p {
    text-align: center;
    font-size: 1rem;
}

input {
    padding: 10px;
    border-radius: 10px;
    border: none;
    width: 250px;
    text-align: center;
}

button {
    padding: 10px;
    border: none;
    border-radius: 10px;
    color: rgb(246, 246, 254);
    background-color: rgba(46, 46, 228, 0.746);
    cursor: pointer;
}
</style>
</head>
<body>
    <div class="container">

    <h1>Cominsg Soon</h1>
    <p>Our amazing new website is on its way. Stay tuned for the big launch!</p>
     
    <form>
       <input type="email" placeholder="Enter yout email" required/>
       <button type="submit">Notify Me</button>
    </form>

    </div>
</body>
</html>
