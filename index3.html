<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        P{
            text-align: center;
        }
        p.dotted {border-style: dotted;}
        p.dashed {border-style: dashed;}
        p.solid {border-style: solid;}
        p.double {border-style: double;}
        p.groove {border-style: groove;}
        p.ridge {border-style: ridge;}
        p.right {border-style: inset;}
        p.inset {border-style: inset;}
        p.outset {border-style: outset;}
        p.none {border-style: none;}
        p.hidden {border-style: hidden;}
        p.mix {border-style: dotted dashed solid double;}
        /* p{
            border: 1px solid black;
        } */
    </style>
</head>
<body>
    <p class="dotted">A dotted border.</p>
    <p class="dashed">A dotted border.</p>
    <p class="solid">A dotted border.</p>
    <p class="double">A dotted border.</p>
    <p class="groove">A dotted border.</p>
    <p class="ridge">A dotted border.</p>
    <p class="inset">A groove border.</p>
    <p class="outset">An inset border.</p>
    <p class="none">No border.</p>
    <p class="hidden">A hidden border.</p>
    <p class="mix">A mixed border.</p>
</body>
</html>
